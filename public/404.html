<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr &amp; Mrs Laundry | Doorstep Laundry Mumbai</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Encodes pathname & query to redirect back through index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var newUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(newUrl);
    </script>
    <style>
      body {
        background-color: #050508;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 40px 24px;
        max-width: 480px;
      }
      h1 { font-size: 24px; margin-bottom: 12px; color: #38bdf8; }
      p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
      a.btn {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to Mr &amp; Mrs Laundry...</h1>
      <p>Taking you to Mumbai's premier laundry &amp; dry cleaning service. If you are not redirected automatically within 3 seconds, please click below.</p>
      <a class="btn" href="https://mrandmrslaundry.com/">Go to Homepage</a>
    </div>
  </body>
</html>
